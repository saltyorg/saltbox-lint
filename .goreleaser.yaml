version: 2
project_name: saltbox-lint
builds:
  - main: .
    binary: saltbox-lint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES
      - highlight/assets/licenses/*
      - third_party/nuri/LICENSE
      - third_party/nuri/THIRD-PARTY-NOTICE
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '0.0.0-{{ .ShortCommit }}-snapshot'
changelog:
  use: git
release:
  github:
    owner: saltyorg
    name: saltbox-lint
