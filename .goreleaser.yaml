version: 2
project_name: saltbox-lint
builds:
  # Shipped binaries are built offline from the exact tree published as the
  # source archive (release.mjs creates it first), with vendored modules and no
  # VCS stamp. CI rebuilds that archive with the same settings and requires
  # byte-identical binaries; integration tests keep both definitions aligned.
  - main: .
    dir: bin/release-source/saltbox-lint-source
    binary: saltbox-lint
    env:
      - CGO_ENABLED=0
      - GOFLAGS=
      - GOPROXY=off
      - GOSUMDB=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -mod=vendor
      - -buildvcs=false
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES
      - highlight/assets/licenses/*
      - third_party/nuri/LICENSE
      - third_party/nuri/THIRD-PARTY-NOTICE
      - src: bin/release-source/licenses
        dst: licenses
      - src: bin/release-source/SOURCE.json
        dst: SOURCE.json
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ .Env.SALTBOX_RELEASE_VERSION }}'
changelog:
  use: git
release:
  github:
    owner: saltyorg
    name: saltbox-lint
