name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
    with:
      stable: true
  release:
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: extension/.node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Set up npm
        run: node tools/setup-npm.mjs
      - name: Install the pinned archive reader
        run: npm --prefix extension ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-artifacts
          path: dist
      - name: Verify tag, source identity, packages and checksums before publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node extension/scripts/verify-release.mjs dist
      - name: Publish exactly the native-qualified archives and matching source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ $RELEASE_TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          awk -v release_version="${RELEASE_TAG#v}" '
            /^## / {
              if (selected) exit
              selected = ($2 == release_version)
              next
            }
            selected { print }
          ' extension/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          [[ -s "$RUNNER_TEMP/release-notes.md" ]]
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*.tar.gz dist/*.zip dist/*.vsix dist/SOURCE.json \
            dist/vsix-artifacts.json dist/checksums.txt
  marketplace:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: extension/.node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Set up npm
        run: node tools/setup-npm.mjs
      - name: Install the pinned publishing tool
        run: npm --prefix extension ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-artifacts
          path: dist
      - name: Verify qualified release checksums
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Sign in as the publishing identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish all qualified platform packages to Marketplace
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node extension/scripts/publish-marketplace.mjs dist
