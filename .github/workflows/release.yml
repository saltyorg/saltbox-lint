name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
    with:
      stable: true
  release:
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-artifacts
          path: dist
      - name: Publish exactly the native-qualified archives and matching source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ $RELEASE_TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            dist/*.tar.gz dist/*.zip dist/*.vsix dist/SOURCE.json \
            dist/vsix-artifacts.json dist/checksums.txt
# Marketplace uploads remain a separately authorized manual owner action.
