name: Marketplace identity
on:
  workflow_dispatch:
permissions: {}
jobs:
  profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: marketplace-publish
    permissions:
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Sign in as the publishing identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Retrieve the Marketplace member ID
        shell: bash
        run: |
          profile_id=$(az rest \
            --method GET \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv --only-show-errors)
          if [[ ! "$profile_id" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo '::error::Azure DevOps did not return a valid profile ID.'
            exit 1
          fi
          printf 'Marketplace member ID: %s\n' "$profile_id"
          printf '## Marketplace identity\n\nPublisher: saltyorg\n\nMember ID: %s\n\nAdd this ID as a Contributor in the publisher Members page.\n' \
            "$profile_id" >> "$GITHUB_STEP_SUMMARY"
