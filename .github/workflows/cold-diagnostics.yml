name: Cold diagnostics investigation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: extension/.node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Prepare native source product and controller
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm --prefix extension ci --ignore-scripts
          npm --prefix extension run build
          npm --prefix extension run stage:binary
          npm --prefix extension run stage:test-fixture
      - name: Package the native diagnostic build
        working-directory: extension
        run: |
          node --input-type=module <<'JS'
          import {createVSIX} from '@vscode/vsce';
          import {cpSync, mkdirSync, mkdtempSync, rmSync, writeFileSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join, resolve} from 'node:path';
          import {manifest} from './scripts/release-inputs.mjs';
          const stage = mkdtempSync(join(tmpdir(), 'saltbox-diagnostic-vsix-'));
          try {
            mkdirSync(join(stage, 'bin'));
            mkdirSync(join(stage, 'dist'));
            cpSync('bin/saltbox-lint', join(stage, 'bin/saltbox-lint'));
            cpSync('dist/extension.js', join(stage, 'dist/extension.js'));
            cpSync('README.md', join(stage, 'README.md'));
            cpSync('../LICENSE', join(stage, 'LICENSE'));
            const {scripts, devDependencies, packageManager, ...runtime} = manifest;
            delete runtime.engines.node;
            runtime.files = ['bin/saltbox-lint', 'dist/extension.js', 'README.md', 'LICENSE'];
            writeFileSync(join(stage, 'package.json'), JSON.stringify(runtime));
            mkdirSync('../dist', {recursive: true});
            await createVSIX({cwd: stage, packagePath: resolve('../dist', `saltbox-lint-${manifest.version}-darwin-arm64.vsix`), target: 'darwin-arm64', dependencies: false, githubBranch: 'main'});
          } finally {
            rmSync(stage, {recursive: true, force: true});
          }
          JS
      - name: Reproduce installed cold diagnostics without waiting for release packaging
        working-directory: extension
        env:
          SALTBOX_LINT_TRACE_CODE_ACTIONS: "1"
          SALTBOX_TEST_HOST_RESULTS_FILE: ${{ runner.temp }}/cold-source-results
        run: |
          node scripts/test-native-hosts.mjs --cold-diagnostics
      - name: Write investigation summary
        if: always()
        env:
          PROBE_STATUS: ${{ job.status }}
        run: |
          printf '## Cold diagnostics investigation\n\nResult: %s\n\nNative diagnostic VSIX only, not a release asset. This does not qualify release packages. Each sample has fresh joined editor owners; failures stop the series. See the native provider trace and per-sample records in the job log.\n' "$PROBE_STATUS" >> "$GITHUB_STEP_SUMMARY"
