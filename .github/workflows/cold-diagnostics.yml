name: Cold diagnostics investigation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: extension/.node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Prepare native source product and controller
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm --prefix extension ci --ignore-scripts
          npm --prefix extension run build
          npm --prefix extension run stage:binary
          npm --prefix extension run stage:test-fixture
      - name: Reproduce cold diagnostics without waiting for release packaging
        working-directory: extension
        env:
          SALTBOX_LINT_TRACE_CODE_ACTIONS: "1"
          SALTBOX_TEST_HOST_RESULTS_FILE: ${{ runner.temp }}/cold-source-results
        run: |
          node --input-type=module <<'JS'
          import {runColdDiagnostics} from './scripts/native-hosts.mjs';
          import {runHostProfile} from './scripts/host-launcher.mjs';
          await runColdDiagnostics({resultsFile: process.env.SALTBOX_TEST_HOST_RESULTS_FILE}, {
            profile: (configuration, dependencies) => runHostProfile({
              ...configuration,
              env: {...configuration.env, SALTBOX_TEST_VSIX: undefined},
            }, dependencies),
          });
          JS
      - name: Write investigation summary
        if: always()
        env:
          PROBE_STATUS: ${{ job.status }}
        run: |
          printf '## Cold diagnostics investigation\n\nResult: %s\n\nSource-mode reproduction only. This does not qualify release packages. Each sample has fresh joined editor owners; failures stop the series. See the native provider trace and per-sample records in the job log.\n' "$PROBE_STATUS" >> "$GITHUB_STEP_SUMMARY"
