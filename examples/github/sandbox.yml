# Replace only the saltbox-lint job in .github/workflows/sandbox.yml.
# This is an illustrative migration template, not a published release claim.
# Replace RELEASE_COMMIT_SHA with the published Action's full commit SHA and
# v0.1.0 with the exact stable binary version selected for adoption.
name: sandbox linter migration example
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saltbox-lint:
    if: github.event_name == 'pull_request' || !(github.event_name == 'push' && github.actor == 'renovate[bot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: sandbox
      - name: Run Saltbox Lint
        uses: saltyorg/saltbox-lint@RELEASE_COMMIT_SHA
        with:
          version: v0.1.0
          working-directory: sandbox
          paths: '.'
