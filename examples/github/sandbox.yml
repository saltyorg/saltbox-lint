# Replace only the saltbox-lint job in .github/workflows/sandbox.yml.
# Adoption template using published Action v1.3.2 and linter v0.1.0.
# Preserve unrelated jobs and workflow triggers; Renovate owns version bumps.
name: sandbox linter migration example
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saltbox-lint:
    if: github.event_name == 'pull_request' || !(github.event_name == 'push' && github.actor == 'renovate[bot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: sandbox
      - name: Run Saltbox Lint
        uses: saltyorg/github-actions/saltbox-lint@v1.3.2
        with:
          version: v0.1.0
          working-directory: sandbox
          paths: '.'
